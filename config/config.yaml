# ============================================================
# LOF基金套利分析工具 - 配置文件
# ============================================================
# 使用方法：修改下方配置后，运行 python main.py

# ------------------------------------------------------------
# 基金列表
# ------------------------------------------------------------
# 可配置多只LOF基金，支持格式：
#   1. 仅代码："501098"
#   2. 代码+类型：{"code": "501098", "type": "active"}
#   3. 代码+估值器参数：{"code": "160119", "estimator": "etf_link", "params": {"etf_code": "510500"}}
#
# type 可选值：
#   - "active"    主动型基金（使用持仓模拟法估值）
#   - "index"     指数型基金（使用指数映射法估值）
#   - "etf_link"  ETF联接基金（使用底仓ETF价格法估值）
#   - "auto"      自动识别（默认）
#
# estimator 可选值：
#   - "holding"   前十大重仓股模拟法
#   - "industry"  行业ETF映射法
#   - "index"     指数实时映射法
#   - "etf_link"  底仓ETF实时价格法
# ------------------------------------------------------------

funds:
  - code: "501098"
    name: "建信优享科技创新混合(LOF)"
    type: "auto"       # 自动识别为主动型

  - code: "160119"
    name: "南方中证500ETF联接(LOF)A"
    type: "auto"       # 自动识别为指数型

# 可继续添加更多基金：
#  - code: "163407"
#    name: "兴全沪深300指数(LOF)"
#    type: "index"

# ------------------------------------------------------------
# 套利信号参数
# ------------------------------------------------------------
arbitrage:
  # 溢价套利触发阈值（%），场内价格高于净值的比例
  premium_threshold: 1.5

  # 折价套利触发阈值（%），场内价格低于净值的比例（填正数，内部会取负）
  discount_threshold: 1.5

  # 费率安全系数，实际成本 = 估算成本 × 该系数
  fee_multiplier: 1.2

# ------------------------------------------------------------
# 输出配置
# ------------------------------------------------------------
output:
  # 输出目录
  dir: "./output"

  # 输出格式：text / json / html / all
  format: "all"

  # 是否在控制台打印结果
  print_to_console: true

  # 文件名前缀
  filename_prefix: "lof_arbitrage"

# ------------------------------------------------------------
# 数据获取配置
# ------------------------------------------------------------
data:
  # 请求超时时间（秒）
  timeout: 10

  # 请求间隔（秒），避免被封
  request_interval: 0.5

  # 是否尝试获取实时持仓行情（用于主动型基金估值）
  fetch_holdings_quotes: true

# ------------------------------------------------------------
# 监控模式配置（可选）
# ------------------------------------------------------------
monitor:
  # 是否启用持续监控模式
  enabled: false

  # 监控间隔（秒）
  interval: 60

  # 仅在有套利信号时输出
  only_signal: true
